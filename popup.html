<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clean FB</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Clean FB</h1>
        <button id="toggleAll" type="button" aria-pressed="true">On</button>
      </header>

      <label>
        <span>Hide ads</span>
        <input id="ads" type="checkbox" checked>
      </label>
      <label>
        <span>Hide Reels</span>
        <input id="reels" type="checkbox" checked>
      </label>
      <label>
        <span>Hide friend suggestions</span>
        <input id="friends" type="checkbox" checked>
      </label>

      <footer>AI content filtering — coming next</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
