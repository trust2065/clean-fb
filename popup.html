<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clean FB</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Clean FB</h1>
        <button id="toggleAll" type="button" aria-pressed="true">On</button>
      </header>

      <label><span>Hide left &amp; right sidebars</span><input data-key="centerFeed" type="checkbox"></label>
      <label><span>Hide ads</span><input data-key="ads" type="checkbox"></label>
      <label><span>Hide Reels</span><input data-key="reels" type="checkbox"></label>
      <label><span>Hide friend suggestions</span><input data-key="friends" type="checkbox"></label>
      <label><span>Hide group suggestions</span><input data-key="groups" type="checkbox"></label>
      <label><span>Hide "Suggested for you" posts</span><input data-key="suggested" type="checkbox"></label>

      <footer>AI content filtering — coming next</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
